# =====================================================================
# HAProxy TPROXY 全端口(1-65535)通用透明四层 TCP 截断插口配置（纯 IPv4 双引擎版）
# 当传入 TPROXY=1 / TPROXY=<网卡或网段> / TPROXY=[SOURCE],[BIND:]PORT[,INPUT[,FWMARK]] 时自动启用：
#   - 三层接口 (tun/wg/ipip/eth) : 走 mangle TPROXY -> transparent 监听端口 (getsockname)
#   - 二层网桥 (docker0/br-*/cni): 走 nat REDIRECT  -> 非 transparent 监听端口 (SO_ORIGINAL_DST)
# 配合 --network host --privileged 默认透传客户端源 IP (usesrc clientip)，零配置复用宿主机原路由与 NAT
# =====================================================================

global
    chroot /
    uid 0
    log stdout format raw local0 info
    maxconn 50000
    tune.bufsize 65536
    # tune.notsent-lowat.client 131072
    # tune.notsent-lowat.server 131072
    stats socket /var/run/haproxy.sock level admin

defaults
    mode tcp
    log global
    option dontlognull
    option splice-request       # 强制前段->后段方向走 Linux 内核态零拷贝管道搬运
    option splice-response      # 强制后段->前段方向走 Linux 内核态零拷贝管道搬运
    option clitcpka             # 开启前段客户端侧 TCP Keepalive
    option srvtcpka             # 开启后段服务端侧 TCP Keepalive
    retries            2
    timeout connect    5s
    timeout client     60s
    timeout server     60s
    timeout tunnel     1h       # 保障长连接不断线，同时自动回收死连接
    timeout client-fin 15s
    timeout server-fin 15s

frontend tcp_tproxy_in
    # BEGIN_TPROXY_BIND (由 run.sh 自动渲染 L3 TPROXY 与 L2 网桥 REDIRECT 监听端口)
    bind 127.0.0.1:10888 transparent backlog 4096
    bind 0.0.0.0:10889 backlog 4096
    # END_TPROXY_BIND
    # 注意：全端口透明代理不启用 defer-accept，确保 SSH(22) 等服务端先发包协议 0 延迟秒连
    log-format "%ci:%cp [TPROXY] => %fi:%fp [%B bytes, %Tt ms, %ts]"

    # 防自环与防外网直连扫描保护：
    # 凡是目标 IP 属于本机任意网卡/环回地址的连接（非 TPROXY/REDIRECT 过境流量），在握手层当场断开！
    tcp-request connection reject if { dst_is_local }

    # BEGIN_TPROXY_FILTER (默认留空为 0 损耗纯四层盲转；配置 ALLOW 或 DENY 时由 run.sh 自动注入域名:端口过滤规则)
    # END_TPROXY_FILTER

    default_backend tcp_tproxy_out

backend tcp_tproxy_out
    # BEGIN_TPROXY_OUT (由 run.sh 根据 TPROXY 中的 SOURCE 与 FWMARK 字段按需自动注入)
    # END_TPROXY_OUT

    # 直接提取客户端原本访问的真实目标 IP (dst) 与目标端口 (dst_port)，建立下一段独立 TCP 连接
    tcp-request content set-dst      dst
    tcp-request content set-dst-port dst_port
    server next_hop 0.0.0.0:0

# BEGIN_TPROXY_HTTP_OUT (仅在配置 ALLOW 或 DENY 时由 run.sh 自动注入明文 HTTP/WS 透明过滤后端)
# END_TPROXY_HTTP_OUT
