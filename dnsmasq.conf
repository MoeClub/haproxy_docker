# 对外劫持 DNS 服务（默认监听在容器外网网卡 eth0 的 3535/udp 端口）
# 启动时 run.sh 会从模板还原并根据 DEVICE / PORT / ADDR / UDNS / TABLE / DNS 自动渲染此文件

pid-file=/var/run/dnsmasq.pid
interface=eth0
except-interface=lo
bind-interfaces
domain-needed
strict-order
bogus-priv
no-negcache
no-resolv
no-hosts
no-poll
no-ping

# 过滤 IPv6 (AAAA)、HTTPS/SVCB (防 ECH 加密 SNI 与 QUIC 绕过) 及 ANY (防 UDP 反射放大攻击)
filter-rr=AAAA
filter-rr=HTTPS
filter-rr=SVCB
filter-rr=ANY

port=3535

user=root

max-cache-ttl=64
cache-size=1024

# 将所有未例外的域名 A 记录无条件解析为本机公网 IP（由 run.sh 自动替换）
address=/#/127.0.0.1

# BEGIN_UPSTREAM_DNS (非 A 记录或例外直通域名交由上游真实 DNS 解析)
server=8.8.4.4#53
server=1.1.1.1#53
# END_UPSTREAM_DNS
