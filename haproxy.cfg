# =====================================================================
# HAProxy SNI / Host 动态分流与流媒体/AI解锁配置（纯 IPv4 通用组件版）
# 支持：三种域名匹配粒度(^精确 / .泛子域 / 默认全含)、PROXY v1/v2、明文 HTTP 跳 HTTPS
# =====================================================================

global
    chroot /
    uid 0
    log stdout format raw local0 info
    maxconn 20000
    tune.bufsize 65536          # 64KB 缓冲区，兼容后量子超大 TLS 握手包并提升大块吞吐效率
    stats socket /var/run/haproxy.sock level admin

defaults
    log global
    option dontlognull
    option splice-auto          # 开启 Linux 内核态零拷贝转发
    option clitcpka             # 开启客户端侧 TCP Keepalive 探活
    option srvtcpka             # 开启服务端侧 TCP Keepalive 探活
    retries            2        # 连接后端失败最多重试 2 次
    timeout connect    5s
    timeout client     60s
    timeout server     60s
    timeout tunnel     1h       # 保障 ocserv / WebSocket / AI 流式长连接稳定
    timeout client-fin 15s      # 快速回收半关闭连接，防止僵尸连接堆积
    timeout server-fin 15s

# 公网真实 DNS 解析器（HAProxy 内存级缓存，由 run.sh 根据 UDNS 自动渲染上游）
resolvers upstream_dns
    # BEGIN_UPSTREAM_DNS
    nameserver up1 8.8.4.4:53
    nameserver up2 1.1.1.1:53
    # END_UPSTREAM_DNS
    accepted_payload_size 8192  # 支持超长 CDN CNAME 链，防止截断解析失败
    resolve_retries 3
    timeout resolve 800ms
    timeout retry   300ms
    hold valid      300s        # 有效解析记录缓存 300 秒
    hold obsolete   60s         # 上游瞬时超时抖动时，允许沿用旧缓存 60 秒不断流
    hold nx         12s         # 无效/失败记录统一 12 秒后再重查
    hold refused    12s
    hold timeout    12s
    hold other      12s

# Docker 内置网桥 DNS 解析器（仅在目标为不含点号的同网桥容器名，如 ocserv / web 时按需调用）
resolvers docker_dns
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 2
    timeout resolve 500ms
    timeout retry   200ms
    hold valid      30s
    hold nx         12s
    hold refused    12s
    hold timeout    12s
    hold other      12s

# ================= 1. 443 端口：TLS SNI 动态分流 + 明文 HTTP 自动跳 HTTPS =================
frontend https_in
    bind 0.0.0.0:443 defer-accept backlog 4096
    mode tcp
    log-format "%ci:%cp [443] %[var(sess.host_log)] => %[var(sess.ip_str)]:%[var(sess.dst_port)] [%B bytes, %Tt ms, %ts]"

    tcp-request inspect-delay 5s

    # 若误发了明文 HTTP 请求到 443 端口（类似 Nginx 497），切换至 HTTP 模式处理 302 跳转
    tcp-request content switch-mode http if HTTP

    # 非明文 HTTP 且非标准 TLS ClientHello 握手包，0 字节直接断掉 TCP
    tcp-request content reject unless { req.ssl_hello_type 1 }

    # 记录请求的 SNI 域名供日志查看
    tcp-request content set-var(sess.host_log) req.ssl_sni if { req.ssl_sni -m found }

    # 在小写 SNI 前冠以起始定界符 ^（如 ^xyz.com / ^a.xyz.com），通过单表同时支持 ^xyz.com(精确) 与 .xyz.com(子域)
    tcp-request content set-var-fmt(sess.match_sni) ^%[req.ssl_sni,lower] if { req.ssl_sni -m len 1:253 }
    tcp-request content set-var(sess.route) var(sess.match_sni),map_end(/etc/haproxy/haproxy.map) if { var(sess.match_sni) -m found }

    # 若开启了 FALLBACK=1，未命中表的合法外部域名（含点号且非纯 IP）兜底走原端口动态解锁；默认 FALLBACK=0 严格拦截
    tcp-request content set-var(sess.route) str(*) if !{ var(sess.route) -m found } { req.ssl_sni -m len 1:253 } { req.ssl_sni -m sub . } !{ req.ssl_sni -m reg ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ } !{ req.ssl_sni -m sub : } { env(FALLBACK) -m str 1 }

    # 未命中转发表（或 IP 直连无 SNI），不返回任何内容，直接断掉 TCP
    tcp-request content reject unless { var(sess.route) -m found }

    # 拆解目标规则：主机:端口[/可选标记(proxy|proxy-v1|http)]
    tcp-request content set-var(sess.addr_port) var(sess.route),field(1,/)
    tcp-request content set-var(sess.opt)       var(sess.route),field(2,/)
    tcp-request content set-var(sess.dst_host)  var(sess.addr_port),field(1,:)
    tcp-request content set-var(sess.raw_port)  var(sess.addr_port),field(2,:)
    tcp-request content set-var(sess.dst_port)  int(443)
    tcp-request content set-var(sess.dst_port)  var(sess.raw_port) if { var(sess.raw_port) -m reg ^[0-9]+$ }

    # 仅限明文 HTTP 的后端（/http）不接收 443 TLS 流量
    tcp-request content reject if { var(sess.opt) -m str -i http }

    # 解析目标 IPv4：* 代表原请求 SNI；纯 IPv4 直接使用；域名走对应解析器
    tcp-request content set-var(sess.dst_host) req.ssl_sni if { var(sess.dst_host) -m str * }
    acl host_is_ip   var(sess.dst_host) -m reg ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
    acl host_has_dot var(sess.dst_host) -m sub .
    tcp-request content set-var(sess.dst_ip) var(sess.dst_host) if host_is_ip
    tcp-request content do-resolve(sess.dst_ip,upstream_dns,ipv4) var(sess.dst_host) if !host_is_ip host_has_dot
    tcp-request content do-resolve(sess.dst_ip,docker_dns,ipv4)   var(sess.dst_host) if !host_is_ip !host_has_dot

    tcp-request content reject unless { var(sess.dst_ip) -m found }

    # 纯 IPv4 校验（拦截仅存在 AAAA 记录时的解析回退）与本机 443 防自环死循环保护
    tcp-request content set-var(sess.pub_ip)     env(PUBLIC_ADDR)
    tcp-request content set-var-fmt(sess.ip_str) %[var(sess.dst_ip)]
    tcp-request content reject if { var(sess.ip_str) -m sub : }
    tcp-request content reject if { var(sess.dst_port) -m int 443 } { var(sess.pub_ip) -m len 1:64 } { var(sess.ip_str),strcmp(sess.pub_ip) eq 0 }
    tcp-request content reject if { var(sess.dst_port) -m int 443 } { var(sess.ip_str) -m reg ^(127\.|0\.0\.0\.0$) }

    tcp-request content accept

    use_backend bk_443_to_https if HTTP
    use_backend bk_tcp_proxy    if { var(sess.opt) -m str -i proxy }
    use_backend bk_tcp_proxy_v1 if { var(sess.opt) -m str -i proxy-v1 }
    default_backend bk_tcp_raw

# 普通 HTTPS Web / CPA 服务 / AI 流媒体解锁（纯四层原样透传）
backend bk_tcp_raw
    mode tcp
    tcp-request content set-dst      var(sess.dst_ip)
    tcp-request content set-dst-port var(sess.dst_port)
    server raw 0.0.0.0:0

# 需透传真实客户端 IP（二进制 PROXY Protocol v2，如 ocserv / 新版 Nginx）
backend bk_tcp_proxy
    mode tcp
    tcp-request content set-dst      var(sess.dst_ip)
    tcp-request content set-dst-port var(sess.dst_port)
    server proxy_v2 0.0.0.0:0 send-proxy-v2

# 需透传真实客户端 IP（文本格式 PROXY Protocol v1，兼容只认 v1 的组件）
backend bk_tcp_proxy_v1
    mode tcp
    tcp-request content set-dst      var(sess.dst_ip)
    tcp-request content set-dst-port var(sess.dst_port)
    server proxy_v1 0.0.0.0:0 send-proxy

# 443 端口收到明文 HTTP 请求时：仅对普通白名单域名返回 302 跳 https://，非白名单及 proxy/http 域名 0 字节断连
backend bk_443_to_https
    mode http
    timeout http-request    5s
    timeout http-keep-alive 15s
    http-request set-var(sess.host_log) req.hdr(host) if { req.hdr(host) -m found }
    http-request set-var(txn.req_host)  req.hdr(host),host_only,lower if { req.hdr(host) -m found }
    http-request set-var-fmt(txn.match_host) ^%[var(txn.req_host)] if { var(txn.req_host) -m len 1:253 }
    http-request set-var(txn.route) var(txn.match_host),map_end(/etc/haproxy/haproxy.map) if { var(txn.match_host) -m found }
    http-request set-var(txn.route) str(*) if !{ var(txn.route) -m found } { var(txn.req_host) -m len 1:253 } { var(txn.req_host) -m sub . } !{ var(txn.req_host) -m reg ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ } !{ var(txn.req_host) -m sub : } { env(FALLBACK) -m str 1 }
    http-request reject unless { var(txn.route) -m found }
    http-request reject if { var(txn.route),field(2,/) -m str -i http proxy proxy-v1 }
    http-request redirect scheme https code 302

# ================= 2. 80 端口：HTTP Host 动态分流 =================
frontend http_in
    bind 0.0.0.0:80 defer-accept backlog 4096
    mode tcp
    log-format "%ci:%cp [80] %[var(sess.host_log)] => %[var(sess.ip_str)]:%[var(sess.dst_port)] [%B bytes, %Tt ms, %ts]"
    tcp-request inspect-delay 5s
    # 合法 HTTP 请求直接升级进入七层处理；非 HTTP 流量在 TCP 层 0 字节断连（不返回 400 Bad Request）
    tcp-request content switch-mode http if HTTP
    tcp-request content reject
    default_backend bk_http_raw

backend bk_http_raw
    mode http
    option http-server-close
    timeout http-request    5s
    timeout http-keep-alive 15s

    http-request set-var(sess.host_log) req.hdr(host) if { req.hdr(host) -m found }
    http-request set-var(txn.req_host)  req.hdr(host),host_only,lower if { req.hdr(host) -m found }
    http-request set-var-fmt(txn.match_host) ^%[var(txn.req_host)] if { var(txn.req_host) -m len 1:253 }
    http-request set-var(txn.route) var(txn.match_host),map_end(/etc/haproxy/haproxy.map) if { var(txn.match_host) -m found }
    http-request set-var(txn.route) str(*) if !{ var(txn.route) -m found } { var(txn.req_host) -m len 1:253 } { var(txn.req_host) -m sub . } !{ var(txn.req_host) -m reg ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ } !{ var(txn.req_host) -m sub : } { env(FALLBACK) -m str 1 }

    # 非表内 Host 域名，0 字节直接断掉 TCP（不返回 403）
    http-request reject unless { var(txn.route) -m found }

    http-request set-var(txn.addr_port)   var(txn.route),field(1,/)
    http-request set-var(txn.opt)         var(txn.route),field(2,/)
    http-request set-var(txn.dst_host)    var(txn.addr_port),field(1,:)
    http-request set-var(txn.raw_port)    var(txn.addr_port),field(2,:)
    http-request set-var(txn.custom_port) var(txn.raw_port) if { var(txn.raw_port) -m reg ^[0-9]+$ }

    # proxy / proxy-v1 服务不在 80 端口响应明文请求，直接断连
    http-request reject if { var(txn.opt) -m str -i proxy proxy-v1 }

    # 本机自定义 HTTPS 端口服务（未标 http），访问 http:// 时自动 301 跳转至 https://
    http-request redirect scheme https code 301 if { var(txn.custom_port) -m found } !{ var(txn.opt) -m str -i http }

    http-request set-var(txn.dst_port) int(80)
    http-request set-var(txn.dst_port) var(txn.custom_port) if { var(txn.custom_port) -m found }
    http-request set-var(sess.dst_port) var(txn.dst_port)

    http-request set-var(txn.dst_host) var(txn.req_host) if { var(txn.dst_host) -m str * }
    acl host_is_ip   var(txn.dst_host) -m reg ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
    acl host_has_dot var(txn.dst_host) -m sub .
    http-request set-var(txn.dst_ip) var(txn.dst_host) if host_is_ip
    http-request do-resolve(txn.dst_ip,upstream_dns,ipv4) var(txn.dst_host) if !host_is_ip host_has_dot
    http-request do-resolve(txn.dst_ip,docker_dns,ipv4)   var(txn.dst_host) if !host_is_ip !host_has_dot

    http-request reject unless { var(txn.dst_ip) -m found }

    # 纯 IPv4 校验与本机 80 防自环保护
    http-request set-var(txn.pub_ip)      env(PUBLIC_ADDR)
    http-request set-var-fmt(txn.ip_str)  %[var(txn.dst_ip)]
    http-request set-var(sess.ip_str)     var(txn.ip_str)
    http-request reject if { var(txn.ip_str) -m sub : }
    http-request reject if { var(txn.dst_port) -m int 80 } { var(txn.pub_ip) -m len 1:64 } { var(txn.ip_str),strcmp(txn.pub_ip) eq 0 }
    http-request reject if { var(txn.dst_port) -m int 80 } { var(txn.ip_str) -m reg ^(127\.|0\.0\.0\.0$) }

    http-request set-dst      var(txn.dst_ip)
    http-request set-dst-port var(txn.dst_port)
    server raw_http 0.0.0.0:0
